<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | ExpenseTracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main style="max-width: 420px; margin: 70px auto; padding: 24px;">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to manage your finances.</p>

        <p th:if="${param.error}" style="color: #e66b80;">
            Invalid email or password.
        </p>

        <p th:if="${param.logout}" style="color: #159d79;">
            You have been logged out.
        </p>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required
                style="display:block; width:100%; padding:12px; margin:8px 0 18px;">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required
                style="display:block; width:100%; padding:12px; margin:8px 0 20px;">
            <p class="auth-footer">
                Don't have an account?
                <a th:href="@{/register}">Create account</a>
            </p>
            <button type="submit" class="primary-button">
                Sign In
            </button>
        </form>
    </main>
</body>

</html>
