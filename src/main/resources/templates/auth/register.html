
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Expense Tracker</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card auth-card-wide">

        <div class="auth-heading">
            <h1>Create your account</h1>
            <p>Let's get to know you better.</p>
        </div>

        <form th:action="@{/register}"
              th:object="${registerRequest}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- PERSONAL INFORMATION -->
            <h3>Personal Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text"
                           th:field="*{username}"
                           placeholder="Your full name">
                    <small class="error" th:errors="*{username}"></small>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel"
                           th:field="*{phoneNumber}"
                           placeholder="9876543210">
                    <small class="error" th:errors="*{phoneNumber}"></small>
                </div>

                <div class="form-group full-width">
                    <label>Email Address *</label>
                    <input type="email"
                           th:field="*{email}"
                           placeholder="you@example.com">
                    <small class="error" th:errors="*{email}"></small>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" th:field="*{dateOfBirth}">
                    <small class="error" th:errors="*{dateOfBirth}"></small>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select th:field="*{gender}">
                        <option value="">Prefer not to say</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

            </div>

            <!-- ADDRESS INFORMATION -->
            <h3>Address Information</h3>

            <div class="form-grid">

                <div class="form-group full-width">
                    <label>Full Address</label>
                    <textarea th:field="*{address}"
                              rows="2"
                              placeholder="House number, street, locality"></textarea>
                </div>

                <div class="form-group">
                    <label>Country</label>
                    <input type="text"
                           th:field="*{country}"
                           placeholder="India">
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input type="text"
                           th:field="*{state}"
                           placeholder="Odisha">
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text"
                           th:field="*{city}"
                           placeholder="Bhubaneswar">
                </div>

                <div class="form-group">
                    <label>PIN Code</label>
                    <input type="text"
                           th:field="*{postalCode}"
                           placeholder="751001">
                </div>

            </div>

            <!-- FINANCIAL PREFERENCES -->
            <h3>Financial Preferences</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Preferred Currency</label>
                    <select th:field="*{preferredCurrency}">
                        <option value="INR">INR (₹)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="GBP">GBP (£)</option>
                    </select>
                    <small class="error"
                           th:errors="*{preferredCurrency}"></small>
                </div>

                <div class="form-group">
                    <label>Occupation</label>
                    <input type="text"
                           th:field="*{occupation}"
                           placeholder="Your occupation">
                </div>

                <div class="form-group full-width">
                    <label>Monthly Income</label>
                    <input type="number"
                           th:field="*{monthlyIncome}"
                           min="0"
                           step="0.01"
                           placeholder="Enter monthly income">
                    <small class="error"
                           th:errors="*{monthlyIncome}"></small>
                </div>

            </div>

            <!-- ACCOUNT SECURITY -->
            <h3>Account Security</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label>Password *</label>
                    <input type="password"
                           th:field="*{password}"
                           placeholder="Minimum 8 characters">
                    <small class="error" th:errors="*{password}"></small>
                </div>

                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password"
                           name="confirmPassword"
                           placeholder="Re-enter password"
                           required>
                </div>

            </div>

            <button type="submit" class="primary-button">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a th:href="@{/login}">Sign in</a>
        </p>

    </div>

</div>

</body>
</html>
